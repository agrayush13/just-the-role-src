<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JustTheRole Promo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; background: #071b46; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .glow { position: absolute; width: 54vw; height: 54vw; border-radius: 50%; background: #37e0b0; filter: blur(110px); opacity: .16; transform: translate(-36vw, -20vw); }
      .lines { position: absolute; inset: 0; opacity: .12; background: repeating-linear-gradient(145deg, transparent 0 54px, #5ee4bc 55px 57px, transparent 58px 112px); }
      .content { position: relative; display: flex; align-items: center; justify-content: center; gap: min(5vw, 74px); width: 100%; height: 100%; padding: 8%; }
      .logo { width: min(48vh, 38vw); height: min(48vh, 38vw); border-radius: 22%; box-shadow: 0 24px 70px rgb(0 0 0 / .28); }
      .copy { display: none; max-width: 620px; }
      h1 { margin: 0; font-size: clamp(48px, 6vw, 86px); line-height: .92; letter-spacing: -.06em; }
      p { max-width: 560px; margin: 22px 0 0; color: #a9f2dc; font-size: clamp(19px, 2vw, 27px); font-weight: 650; letter-spacing: -.02em; }
      body.marquee .content { justify-content: flex-start; padding: 6% 10%; }
      body.marquee .logo { width: 330px; height: 330px; }
      body.marquee .copy { display: block; }
    </style>
    <script>document.addEventListener("DOMContentLoaded", () => { if (innerWidth > 800) document.body.classList.add("marquee"); });</script>
  </head>
  <body>
    <div class="glow"></div><div class="lines"></div>
    <main class="content">
      <img class="logo" src="/icon-source.png" alt="JustTheRole" />
      <div class="copy"><h1>JustTheRole</h1><p>Only the role. None of the noise.</p></div>
    </main>
  </body>
</html>
