<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JustTheRole</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">JUSTTHEROLE</p>
        <h1>Only the role.<br />None of the noise.</h1>
        <p id="page-status" class="status" aria-live="polite">Checking this page…</p>
      </header>

      <section class="master" aria-labelledby="master-label">
        <div>
          <h2 id="master-label">Focus Mode</h2>
          <p>Clean supported job pages using your choices below.</p>
        </div>
        <label class="switch">
          <input id="master-toggle" type="checkbox" />
          <span aria-hidden="true"></span>
          <span class="sr-only">Enable Focus Mode</span>
        </label>
      </section>

      <section class="preset-control" aria-labelledby="preset-label">
        <label id="preset-label" for="preset">View preset</label>
        <select id="preset">
          <option value="balanced">Balanced</option>
          <option value="minimal">Minimal</option>
          <option value="native">Native</option>
          <option value="custom">Custom</option>
        </select>
        <p id="match-summary">Keyword and section tools follow your full settings.</p>
      </section>

      <div class="actions">
        <button id="open-options" class="primary" type="button">Keywords & settings</button>
        <button id="copy-diagnostics" type="button">Copy diagnostics</button>
      </div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <footer>
        <a href="privacy.html" target="_blank">Privacy</a>
        <span>Unofficial and not endorsed by LinkedIn.</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
