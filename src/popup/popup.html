<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JUSTTHEROLE</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="popup-header">
        <div class="topbar">
          <span class="brand"><img src="icons/icon-32.png" alt="" width="30" height="30" /><span class="eyebrow">JUSTTHEROLE</span></span>
          <span class="top-actions">
            <span id="page-status" class="status-icon" data-state="checking" role="status" aria-live="polite" aria-label="Checking page status" title="Checking page status">
              <svg class="status-symbol status-supported" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5.5 12.5 4 4 9-9" /></svg>
              <svg class="status-symbol status-waiting" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3 2" /></svg>
              <svg class="status-symbol status-unsupported" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 10.5V17" /><circle cx="12" cy="7" r="1" fill="currentColor" stroke="none" /></svg>
              <span class="sr-only">Checking page status</span>
            </span>
            <button id="open-options" class="icon-button" type="button" aria-label="Open JUSTTHEROLE settings" title="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.07a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.07 14H3v-4h.07A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.97 4.6 1.7 1.7 0 0 0 10 3.07V3h4v.07a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 20.93 10H21v4h-.07A1.7 1.7 0 0 0 19.4 15Z" />
              </svg>
            </button>
          </span>
        </div>
      </header>

      <label class="master">
        <span class="master-copy">
          <strong id="master-label" class="master-title">Focus Mode: <span id="master-state">Off</span></strong>
          <small>Clean supported job pages.</small>
        </span>
        <span class="switch">
          <input id="master-toggle" type="checkbox" />
          <span aria-hidden="true"></span>
          <span class="sr-only">Enable Focus Mode</span>
        </span>
      </label>

      <section class="widget-panel">
        <label class="widget-control">
          <span><strong>On-page widget</strong><small>Show controls above job details.</small></span>
          <span class="switch">
            <input id="focus-bar-visible" type="checkbox" />
            <span aria-hidden="true"></span>
            <span class="sr-only">Show the on-page JUSTTHEROLE widget</span>
          </span>
        </label>
        <p id="widget-off-note" class="widget-note" hidden>The widget remains visible so you can enable Focus Mode from a job page.</p>
      </section>

      <section class="preset-control" aria-labelledby="preset-label">
        <span id="preset-label" class="preset-label">View preset</span>
        <div class="custom-select" data-custom-select="preset">
          <input id="preset" type="hidden" value="balanced" />
          <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="preset-label preset-value"><span id="preset-value" class="select-value">Balanced</span></button>
          <div class="select-options" role="listbox" aria-labelledby="preset-label" hidden>
            <button type="button" role="option" data-value="balanced" aria-selected="true">Balanced</button>
            <button type="button" role="option" data-value="minimal" aria-selected="false">Minimal</button>
            <button type="button" role="option" data-value="native" aria-selected="false">Native</button>
            <button type="button" role="option" data-value="custom" aria-selected="false">Custom</button>
          </div>
        </div>
        <div id="custom-categories" class="custom-categories" hidden>
          <span>Hide these page blocks</span>
          <div id="custom-category-list" class="custom-category-list"></div>
        </div>
        <div id="hidden-categories" class="hidden-categories" hidden>
          <span>Hidden on this page</span>
          <ul id="hidden-category-list"></ul>
        </div>
        <p id="match-summary">Keyword and section tools follow your full settings.</p>
      </section>

      <p id="feedback" class="feedback" aria-live="polite"></p>
      <footer>
        <nav aria-label="Extension links">
          <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
          <span aria-hidden="true">·</span>
          <button id="copy-diagnostics" class="footer-action" type="button" title="Copy privacy-safe diagnostics">Copy diagnostics</button>
        </nav>
        <span>Unofficial and not endorsed by LinkedIn.</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
